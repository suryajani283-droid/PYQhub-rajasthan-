<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1e40af" />
  <meta name="description" content="Rajasthan Competition Exam Previous Year Papers PDF Download" />
  <title>PYQHub Rajasthan</title>
</head>
<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- Temporary Error Debugger -->
  <script>
    window.onerror = function(message, source, lineno, colno, error) {
      document.body.innerHTML = '<div style="background:red; color:white; padding:20px; font-family:monospace;">' +
        '<h2>🔥 ERROR:</h2>' +
        '<p><b>Message:</b> ' + message + '</p>' +
        '<p><b>Source:</b> ' + source + '</p>' +
        '<p><b>Line:</b> ' + lineno + ', Col: ' + colno + '</p>' +
        (error && error.stack ? '<pre>' + error.stack + '</pre>' : '') +
        '</div>';
    };
  </script>
</body>
</html>
